# Taskfile.yml (Monorepo Root)
version: '3'

tasks:
  infra:up:
    desc: Start local Docker dependencies (PostgreSQL, MinIO, Mailpit) in the background
    cmds:
      - docker-compose up db minio minio-provisioner mailpit -d

  infra:down:
    desc: Stop and remove local Docker containers
    cmds:
      - docker-compose down

  infra:reset:
    desc: "Stop containers and completely wipe local database/storage volumes (Warning: destructive)"
    cmds:
      - docker-compose down -v

  dev:
    desc: Start Hybrid Development Mode (launches Docker dependencies, then runs C# Hot-Reload Watcher)
    deps: [infra:up]
    cmds:
      - pnpm --filter lazuar-api dev
