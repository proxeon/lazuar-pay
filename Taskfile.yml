version: '3'

tasks:
  # ==========================================
  # Focused Pay (apps/lazuar-pay)
  # ==========================================
  pay:restore:
    desc: Restore the focused Pay solution
    dir: apps/lazuar-pay
    cmds:
      - dotnet restore Lazuar.Pay.slnx

  pay:build:
    desc: Build the focused Pay solution
    deps: [pay:restore]
    dir: apps/lazuar-pay
    cmds:
      - dotnet build Lazuar.Pay.slnx --nologo --verbosity minimal

  pay:test:
    desc: Test the focused Pay host (hermetic whoami, checkouts, rails, webhooks)
    dir: apps/lazuar-pay
    cmds:
      - dotnet test Lazuar.Pay.slnx --nologo --verbosity minimal

  pay:dev:
    desc: Run focused Pay on http://localhost:8081
    dir: apps/lazuar-pay
    cmds:
      - dotnet watch run --project src/Lazuar.Pay/Lazuar.Pay.csproj

  pay:api:
    desc: Run Rust Pay host on http://localhost:8095 (same Postgres as C# :8081)
    dir: apps/lazuar-api
    env:
      ASPNETCORE_ENVIRONMENT: Development
      LISTEN_ADDR: 127.0.0.1:8095
      ConnectionStrings__Pay: host=localhost port=5435 user=postgres password=postgres dbname=lazuar_pay
      Pay__CheckoutBaseUrl: http://localhost:5179
      Pay__PublicBaseUrl: http://localhost:8095
      Pay__CorsOrigins: http://localhost:5178,http://127.0.0.1:5178,http://localhost:5179,http://127.0.0.1:5179
      One__BaseUrl: http://localhost:8080/api/v1
    cmds:
      - cargo run

  pay:db:up:
    desc: Start greenfield Pay Postgres on localhost:5435
    dir: apps/lazuar-pay
    cmds:
      - docker compose -f docker-compose.pay.yml up -d

  pay:db:migrate:
    desc: Apply PayDbContext migrations (one context)
    dir: apps/lazuar-pay
    cmds:
      - dotnet ef database update --project src/Lazuar.Pay/Lazuar.Pay.csproj --context PayDbContext

  pay:spec:
    desc: Compile focused Pay TypeSpec to OpenAPI (packages/pay-spec, not api-spec)
    dir: packages/pay-spec
    cmds:
      - pnpm exec tsp compile .
      - node ../../scripts/check-pay-openapi-honesty.mjs

  pay:types:
    desc: Regenerate @repo/pay-types-ts from the compiled spec (run pay:spec first)
    cmds:
      - pnpm --filter @repo/pay-types-ts generate

  pay:merchant:
    desc: Merchant Vite shell on http://localhost:5178
    cmds:
      - pnpm --filter lazuar-pay-merchant dev

  pay:checkout:
    desc: Hosted buyer pay page on http://localhost:5179
    cmds:
      - pnpm --filter lazuar-pay-checkout dev

  # ==========================================
  # Cloudflare named tunnel (preferred hop A for Billplz callbacks)
  # ==========================================
  tunnel:cf:
    desc: Run named Cloudflare tunnel. Preferred hop A for Billplz.
    interactive: true
    cmds:
      - |
        set -euo pipefail
        CFG="${CF_CONFIG:-$HOME/.cloudflared/config.yml}"
        NAME="${CF_TUNNEL_NAME:-aura-025-fulfillment}"
        PAY_HOST="${CF_PAY_HOST:-pay-local.lazuar.dev}"
        AURA_HOST="${CF_AURA_HOST:-aura-local.lazuar.dev}"
        if ! command -v cloudflared >/dev/null 2>&1; then
          echo "cloudflared not installed. macOS: brew install cloudflared"
          exit 1
        fi
        if [ ! -f "$HOME/.cloudflared/cert.pem" ]; then
          echo "Not logged in. Run: task tunnel:cf:login  (pick zone lazuar.dev)"
          exit 1
        fi
        if [ ! -f "$CFG" ]; then
          echo "Missing $CFG — run Aura: task tunnel:cf:init"
          exit 1
        fi
        echo "Named tunnel $NAME"
        echo "  hop A  https://${PAY_HOST}  → 127.0.0.1:8090  (set App__ApiBaseUrl=https://${PAY_HOST}/api/v1)"
        echo "  hop B  https://${AURA_HOST} → 127.0.0.1:8000"
        echo "Leave this running. Do not also start ngrok for hop A."
        cloudflared --config "$CFG" tunnel run "$NAME"

  tunnel:cf:login:
    desc: Authorize cloudflared in the browser. Pick zone lazuar.dev.
    interactive: true
    cmds:
      - |
        if ! command -v cloudflared >/dev/null 2>&1; then
          echo "cloudflared not installed. macOS: brew install cloudflared"
          exit 1
        fi
        cloudflared tunnel login

  tunnel:cf:url:
    desc: Print hop A App__ApiBaseUrl and probe https://pay-local/health
    cmds:
      - |
        set -euo pipefail
        PAY_HOST="${CF_PAY_HOST:-pay-local.lazuar.dev}"
        AURA_HOST="${CF_AURA_HOST:-aura-local.lazuar.dev}"
        echo "App__ApiBaseUrl=https://${PAY_HOST}/api/v1"
        echo "Aura hop B:     https://${AURA_HOST}/api/v1"
        echo "Listen:         http://0.0.0.0:8090  (dual-run; Aura owns 8080)"
        echo "DB:             localhost:5434 / lazuar_mvp"
        pay_code=$(curl -sS -m 10 -o /tmp/pay-cf-health.json -w '%{http_code}' "https://${PAY_HOST}/health" || echo fail)
        echo "GET https://${PAY_HOST}/health → ${pay_code}"
        if [ "$pay_code" != "200" ]; then
          echo "Tunnel down or Pay not on :8090. Start: task tunnel:cf"
          exit 1
        fi

  tunnel:stop:
    desc: Force kill any orphaned ngrok processes running in the background
    cmds:
      - pkill -9 ngrok || echo "No ngrok processes were running."

  # ==========================================
  # Docker / GHCR  (always linux/amd64 for Ubuntu servers)
  # Bake default group = the three Pay images (see docker-bake.hcl)
  # ==========================================
  docker:builder:
    desc: Ensure a buildx builder that can cross-compile linux/amd64 (from Mac ARM too)
    cmds:
      - |
        if ! docker buildx inspect lazuar-builder >/dev/null 2>&1; then
          docker buildx create --name lazuar-builder --driver docker-container --bootstrap
        fi
        docker buildx use lazuar-builder
        docker buildx inspect --bootstrap
        echo "Active builder supports: $(docker buildx inspect --bootstrap | sed -n 's/.*Platforms: //p')"

  docker:build:
    desc: "Build the Pay images (host, merchant, checkout) as linux/amd64"
    deps: [docker:builder]
    cmds:
      - |
        TAG="${TAG:-$(git rev-parse --short HEAD)}"
        REGISTRY="${REGISTRY:-ghcr.io/proxeon}"
        PLATFORMS="${PLATFORMS:-linux/amd64}"
        echo "Building REGISTRY=$REGISTRY TAG=$TAG PLATFORMS=$PLATFORMS (lazuar-pay, lazuar-pay-merchant, lazuar-pay-checkout)"
        docker buildx bake --load \
          --builder lazuar-builder \
          REGISTRY="$REGISTRY" TAG="$TAG" PLATFORMS="$PLATFORMS"

  docker:login:ghcr:
    desc: "Login to GHCR using env GHCR_TOKEN + GHCR_USER (PAT needs write:packages, read:packages)"
    cmds:
      - |
        if [ -z "${GHCR_TOKEN:-}" ] || [ -z "${GHCR_USER:-}" ]; then
          echo "Set GHCR_USER and GHCR_TOKEN env vars (do not commit the token)."
          echo "  export GHCR_USER=your-github-username"
          echo "  export GHCR_TOKEN=ghp_..."
          exit 1
        fi
        echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

  docker:push:
    desc: "Build linux/amd64 and push the Pay images to GHCR. Requires docker login."
    deps: [docker:builder]
    cmds:
      - |
        TAG="${TAG:-$(git rev-parse --short HEAD)}"
        REGISTRY="${REGISTRY:-ghcr.io/proxeon}"
        PLATFORMS="${PLATFORMS:-linux/amd64}"
        echo "Pushing $REGISTRY/lazuar-pay*:$TAG as $PLATFORMS"
        docker buildx bake --push \
          --builder lazuar-builder \
          REGISTRY="$REGISTRY" TAG="$TAG" PLATFORMS="$PLATFORMS"
