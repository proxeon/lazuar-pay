# Pull prebuilt linux/amd64 images from GHCR.
# Host Caddy on the server reverse_proxies published ports.
#
#   export TAG=latest
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d

name: lazuar-hub

services:
  db:
    image: postgres:16-alpine
    container_name: lazuar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: lazuar_mvp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lazuar_mvp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lazuar-network

  api:
    image: ghcr.io/proxeon/lazuar-hub-api:${TAG:-latest}
    container_name: lazuar-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database=lazuar_mvp;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Maximum Pool Size=50;
      ConnectionStrings__TenantConnection: Host=db;Port=5432;Database=lazuar_mvp;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Maximum Pool Size=50;
      ConnectionStrings__MessagingConnection: Host=db;Port=5432;Database=lazuar_mvp;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Maximum Pool Size=20;
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_DEV_URL: ${R2_PUBLIC_DEV_URL:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lazuar-network

  ops-page:
    image: ghcr.io/proxeon/lazuar-hub-ops:${TAG:-latest}
    container_name: lazuar-ops
    ports:
      - "3003:3000"
    depends_on:
      - api
    networks:
      - lazuar-network

  portal-page:
    image: ghcr.io/proxeon/lazuar-hub-portal:${TAG:-latest}
    container_name: lazuar-portal
    ports:
      - "3004:3000"
    environment:
      API_URL: http://api:8080/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      - api
    networks:
      - lazuar-network

  superadmin-page:
    image: ghcr.io/proxeon/lazuar-hub-superadmin:${TAG:-latest}
    container_name: lazuar-superadmin
    ports:
      - "3005:3000"
    depends_on:
      - api
    networks:
      - lazuar-network

volumes:
  pgdata:

networks:
  lazuar-network:
    name: lazuar-network
