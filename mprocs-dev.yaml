# mprocs-dev.yaml
procs:
  lazuar-developers:
    shell: cd apps/lazuar-developers && pnpm dev
    autostart: true
  lazuar-ops:
    shell: cd apps/lazuar-ops && pnpm dev
    autostart: true
  lazuar-admin:
    shell: cd apps/lazuar-admin && pnpm dev
    autostart: true
  lazuar-portal:
    shell: cd apps/lazuar-portal && pnpm dev
    autostart: true
  ngrok-api-tunnel:
    shell: task tunnel:api
    autostart: false
  ngrok-fe-tunnel:
    shell: task tunnel:fe
    autostart: false
