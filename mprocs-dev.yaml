# mprocs-dev.yaml
procs:
  developers-page:
    shell: cd apps/developers-page && pnpm dev
    autostart: true
  ops-page:
    shell: cd apps/ops-page && pnpm dev
    autostart: true
  superadmin-page:
    shell: cd apps/superadmin-page && pnpm dev
    autostart: true
  portal-page:
    shell: cd apps/portal-page && pnpm dev
    autostart: true
  ngrok-api-tunnel:
    shell: task tunnel:api
    autostart: false
  ngrok-fe-tunnel:
    shell: task tunnel:fe
    autostart: false
