# Deploy pay-rs to the VPS. Pulls the GHCR image published by
# publish-pay-rs and restarts the production compose.
#
# One-time server setup (run on the VPS):
#   sudo mkdir -p /srv/lazuar/pay && sudo chown "$USER" /srv/lazuar/pay
#   cd /srv/lazuar/pay && git clone <this-repo-url> repo && cd repo
#   docker network create lazuar-edge
#   cp apps/lazuar-pay-rs/.env.production.example pay-rs.env.production
#   # fill it, chmod 600 pay-rs.env.production
#   # GHCR read login (once; persists in ~/.docker/config.json):
#   #   echo $GHCR_READ_TOKEN | docker login ghcr.io -u USER --password-stdin
#
# Repo secrets (Settings → Secrets → Actions, paste values, never chat):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY (private deploy key; its public key must
#   be in the server's ~/.ssh/authorized_keys AND added as a read-only
#   deploy key on this repo so the server can git pull).

name: deploy pay-rs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GHCR image tag to deploy"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /srv/lazuar/pay/repo
            git pull --ff-only
            export PAY_RS_IMAGE="ghcr.io/${{ github.repository }}/lazuar-pay-rs:${{ github.event.inputs.tag }}"
            export PAY_RS_ENV_FILE=/srv/lazuar/pay/pay-rs.env.production
            docker compose -f apps/lazuar-pay-rs/docker-compose.production.yml pull
            docker compose -f apps/lazuar-pay-rs/docker-compose.production.yml up -d --remove-orphans
            docker compose -f apps/lazuar-pay-rs/docker-compose.production.yml ps
            # No host ports by design — probe from inside the container.
            docker compose -f apps/lazuar-pay-rs/docker-compose.production.yml exec -T pay curl -fsS http://127.0.0.1:8081/health
