# Deploy pay-rs to the VPS. Ships the production compose file from this
# repo to the server, pulls the GHCR image published by publish-pay-rs,
# and restarts the stack. No source checkout on the server.
#
# One-time server setup (run on the VPS):
#   docker network create lazuar-edge
#   mkdir -p ~/lazuar/pay
#   # write ~/lazuar/pay/pay-rs.env.production from
#   # apps/lazuar-pay-rs/.env.production.example (fill, chmod 600)
#   # GHCR read login (once; persists in ~/.docker/config.json):
#   #   echo $GHCR_READ_TOKEN | docker login ghcr.io -u USER --password-stdin
#
# Repo secrets (Settings → Secrets → Actions, paste values, never chat):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY (private key; its public key must be in
#   the server's ~/.ssh/authorized_keys).

name: deploy pay-rs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GHCR image tag to deploy"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ship compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "apps/lazuar-pay-rs/docker-compose.production.yml"
          strip_components: 2
          target: "/home/${{ secrets.VPS_USER }}/lazuar/pay"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/lazuar/pay
            export PAY_RS_IMAGE="ghcr.io/${{ github.repository }}/lazuar-pay-rs:${{ github.event.inputs.tag }}"
            export PAY_RS_ENV_FILE=~/lazuar/pay/pay-rs.env.production
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d --remove-orphans
            docker compose -f docker-compose.production.yml ps
            # No host ports by design — probe from inside the container.
            docker compose -f docker-compose.production.yml exec -T pay curl -fsS http://127.0.0.1:8081/health
