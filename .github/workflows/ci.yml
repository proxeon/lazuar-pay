name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lazuar-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lazuar_mvp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lazuar_mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Used by BillingQueryServiceTests (and any test that targets local Postgres)
      LAZUAR_TEST_PG: Host=localhost;Port=5432;Database=lazuar_mvp;Username=postgres;Password=postgres;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Lazuar.slnx
      - name: Build
        run: dotnet build Lazuar.slnx --no-restore
      - name: Test (Architecture)
        run: dotnet test tests/Lazuar.ArchitectureTests/Lazuar.ArchitectureTests.csproj --no-build --verbosity normal
      - name: Test (Integration)
        run: dotnet test tests/Lazuar.IntegrationTests/Lazuar.IntegrationTests.csproj --no-build --verbosity normal
      - name: Test (Module)
        run: dotnet test tests/Lazuar.ModuleTests/Lazuar.ModuleTests.csproj --no-build --verbosity normal
      - name: Test (Billing)
        run: dotnet test tests/Modules.Billing.Tests/Modules.Billing.Tests.csproj --no-build --verbosity normal
