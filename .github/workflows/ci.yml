name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Test focused Pay host
        run: dotnet test apps/lazuar-pay/Lazuar.Pay.slnx --nologo --verbosity minimal
      - name: Test merchant and checkout
        run: |
          pnpm --filter lazuar-pay-merchant test
          pnpm --filter lazuar-pay-checkout test
      # Issue 012 (issues/003): lint scripts existed locally but CI never ran them —
      # lint-only regressions shipped green.
      - name: Lint merchant and checkout
        run: |
          pnpm --filter lazuar-pay-merchant lint
          pnpm --filter lazuar-pay-checkout lint
      - name: Build merchant and checkout
        env:
          # Build-time sanity check only — the CI artifact is never deployed.
          # Public origin, not a secret (checkout vite.config refuses without it).
          VITE_PAY_API_URL: https://pay.example.test
        run: |
          pnpm --filter lazuar-pay-merchant build
          pnpm --filter lazuar-pay-checkout build
      - name: Compile pay-spec
        run: pnpm --filter @repo/pay-spec exec tsp compile .
      - name: Generated TS matches pay-spec (no drift)
        run: |
          pnpm --filter @repo/pay-types-ts generate
          git diff --exit-code -- packages/pay-types-ts
      - name: Pay OpenAPI ↔ Map* honesty
        run: node scripts/check-pay-openapi-honesty.mjs
      - name: Pay OpenAPI ↔ Rust axum honesty
        run: node scripts/check-pay-rs-openapi-honesty.mjs

  pay-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lazuar-pay-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/lazuar-pay-rs
      - name: Domain purity
        run: |
          set -euo pipefail
          if grep -R -nE 'as f64|as_f64' crates/domain --include='*.rs'; then
            echo "domain forbids f64"
            exit 1
          fi
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy domain
        run: cargo clippy -p domain --all-targets -- -D warnings
      - name: test domain
        run: cargo test -p domain
      - name: test rails (parse + fixtures, no Docker)
        run: cargo test -p rails
      - name: test storage (Docker Postgres 16)
        run: cargo test -p storage
      - name: test api (Docker Postgres 16)
        run: cargo test -p api
      - name: test workers (Docker Postgres 16)
        run: cargo test -p workers
      - name: test pay-client and pay-cli (Docker Postgres 16)
        run: cargo test -p pay-client -p pay-cli
      - name: test pay-mcp (stdio, no Docker)
        run: cargo test -p pay-mcp
      - name: rails has no sqlx
        run: |
          set -euo pipefail
          if cargo tree -p rails -i sqlx >/dev/null 2>&1; then echo "sqlx in rails"; exit 1; fi
      - name: check workspace
        run: cargo check --workspace
      - name: domain has no tokio/sqlx/axum
        run: |
          set -euo pipefail
          if cargo tree -p domain -i tokio >/dev/null 2>&1; then echo "tokio in domain"; exit 1; fi
          if cargo tree -p domain -i sqlx >/dev/null 2>&1; then echo "sqlx in domain"; exit 1; fi
          if cargo tree -p domain -i axum >/dev/null 2>&1; then echo "axum in domain"; exit 1; fi
