name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Phase C.8: generated OpenAPI clients must match TypeSpec (no silent drift).
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Restore local .NET tools (Kiota / NSwag)
        run: dotnet tool restore
      - name: Generate contracts
        run: task gen --force
      - name: Fail if generated clients are dirty
        # note: packages/api-spec/dist is gitignored (dist/); honesty gate is on committed clients.
        run: |
          git diff --exit-code -- \
            packages/api-types-ts/src \
            packages/api-types-dotnet/Generated \
            packages/api-types-dotnet/Lazuar.ApiContracts.cs \
            packages/lhdn-sdk-ts/src/generated \
            packages/lhdn-sdk-dotnet/src/Generated \
          || {
            echo "::error::Generated API clients are out of date. Run 'task gen' and commit the result."
            git status --short
            exit 1
          }

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lazuar-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lazuar_mvp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lazuar_mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Used by BillingQueryServiceTests (and any test that targets local Postgres)
      LAZUAR_TEST_PG: Host=localhost;Port=5432;Database=lazuar_mvp;Username=postgres;Password=postgres;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Lazuar.slnx
      - name: Build
        run: dotnet build Lazuar.slnx --no-restore
      - name: Test (Architecture)
        run: dotnet test tests/Lazuar.ArchitectureTests/Lazuar.ArchitectureTests.csproj --no-build --verbosity normal
      - name: Test (Integration)
        run: dotnet test tests/Lazuar.IntegrationTests/Lazuar.IntegrationTests.csproj --no-build --verbosity normal
      - name: Test (Module)
        run: dotnet test tests/Lazuar.ModuleTests/Lazuar.ModuleTests.csproj --no-build --verbosity normal
      - name: Test (Billing)
        run: dotnet test tests/Modules.Billing.Tests/Modules.Billing.Tests.csproj --no-build --verbosity normal
