name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, rust-parity]

jobs:
  rust-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust Pay host
        env:
          PAY_TEST_POSTGRES: host=localhost port=5435 user=postgres password=postgres dbname=postgres
        run: cargo test --manifest-path apps/lazuar-api/Cargo.toml -- --test-threads=4
      - name: Rust routes ⊆ OpenAPI
        run: node scripts/check-rust-routes.mjs
      - name: Phase 8 cutover code gates
        run: bash scripts/pay-cutover-preflight.sh

  pay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Test focused Pay host
        run: dotnet test apps/lazuar-pay/Lazuar.Pay.slnx --nologo --verbosity minimal
      - name: Test merchant and checkout
        run: |
          pnpm --filter lazuar-pay-merchant test
          pnpm --filter lazuar-pay-checkout test
      - name: Build merchant and checkout
        env:
          # Build-time sanity check only — the CI artifact is never deployed.
          # Public origin, not a secret (checkout vite.config refuses without it).
          VITE_PAY_API_URL: https://pay.example.test
        run: |
          pnpm --filter lazuar-pay-merchant build
          pnpm --filter lazuar-pay-checkout build
      - name: Compile pay-spec
        run: pnpm --filter @repo/pay-spec exec tsp compile .
      - name: Generated TS matches pay-spec (no drift)
        run: |
          pnpm --filter @repo/pay-types-ts generate
          git diff --exit-code -- packages/pay-types-ts
      - name: Pay OpenAPI ↔ C# Map* ↔ Rust router honesty
        run: node scripts/check-pay-openapi-honesty.mjs
      - name: Phase 8 cutover code gates
        run: bash scripts/pay-cutover-preflight.sh
