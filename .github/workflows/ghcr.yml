name: GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: short sha or release tag)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/lazuar-hub
  # Single-host public paths on hub.lazuar.com
  PUBLIC_API_URL: https://hub.lazuar.com/api/v1
  PUBLIC_PORTAL_URL: https://hub.lazuar.com/portal

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/lazuar-api/Dockerfile
            build_args: ""
          - name: portal-page
            dockerfile: apps/portal-page/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://hub.lazuar.com/api/v1
              NEXT_BASE_PATH=/portal
          - name: ops-page
            dockerfile: apps/ops-page/Dockerfile
            build_args: |
              VITE_API_URL=https://hub.lazuar.com/api/v1
              VITE_PORTAL_URL=https://hub.lazuar.com/portal
              VITE_BASE_PATH=/
          - name: superadmin-page
            dockerfile: apps/superadmin-page/Dockerfile
            build_args: |
              VITE_API_URL=https://hub.lazuar.com/api/v1
              VITE_BASE_PATH=/admin/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch safety)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=lazuar-hub/${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: ${{ matrix.build_args }}
