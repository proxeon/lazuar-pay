name: GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: short sha or release tag)"
        required: false
        type: string

# GITHUB_TOKEN can push packages for this repository when packages use
# flat names (lazuar-hub-api) owned by the org/repo — nested lazuar-hub/api
# packages created by a personal PAT often return 403 for Actions.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Flat image names under org (avoids nested-package ACL 403)
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lazuar-hub-api
            dockerfile: apps/lazuar-api/Dockerfile
            build_args: ""
          - name: lazuar-hub-portal
            dockerfile: apps/portal-page/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://hub.lazuar.com/api/v1
              NEXT_BASE_PATH=/portal
          - name: lazuar-hub-ops
            dockerfile: apps/ops-page/Dockerfile
            build_args: |
              VITE_API_URL=https://hub.lazuar.com/api/v1
              VITE_PORTAL_URL=https://hub.lazuar.com/portal
              VITE_BASE_PATH=/
          - name: lazuar-hub-superadmin
            dockerfile: apps/superadmin-page/Dockerfile
            build_args: |
              VITE_API_URL=https://hub.lazuar.com/api/v1
              VITE_BASE_PATH=/admin/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # Prefer a PAT with write:packages if set (org package ACL); else GITHUB_TOKEN
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: ${{ matrix.build_args }}
