# Build 4 hub images → GHCR, then SSH-deploy dedicated hub VPS.
#
# Images (flat names):
#   ghcr.io/proxeon/lazuar-hub-api|ops|portal|superadmin
#   tags: latest + sha-<short>
#
# Secrets:
#   CR_PAT or GHCR_TOKEN     write:packages for push (optional if GITHUB_TOKEN works)
#   GHCR_USERNAME            optional
#   SSH_HOST / SSH_USER / SSH_PRIVATE_KEY   deploy VPS
#   GHCR_PULL_TOKEN          optional read:packages for VPS pull
#   HUB_ENV_FILE             optional multiline .env body

name: GHCR + deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "docker-bake.hcl"
      - "deploy/**"
      - "scripts/remote-deploy.sh"
      - ".github/workflows/ghcr.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Deploy-only pin (sha-abc1234). Empty = build then deploy this commit."
        required: false
        type: string
      skip_build:
        description: "Skip build (deploy existing version only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: lazuar-hub-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build ${{ matrix.name }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_build) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: lazuar-hub-api
            dockerfile: apps/lazuar-api/Dockerfile
            build_args: ""
          - name: lazuar-hub-portal
            dockerfile: apps/portal-page/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://hub.lazuar.com/api/v1
              NEXT_BASE_PATH=/portal
          - name: lazuar-hub-ops
            dockerfile: apps/ops-page/Dockerfile
            build_args: |
              VITE_API_URL=https://hub.lazuar.com/api/v1
              VITE_PORTAL_URL=https://hub.lazuar.com/portal
              VITE_BASE_PATH=/
          - name: lazuar-hub-superadmin
            dockerfile: apps/superadmin-page/Dockerfile
            build_args: |
              VITE_API_URL=https://hub.lazuar.com/api/v1
              VITE_BASE_PATH=/admin/
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.sha }},enable=true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: ${{ matrix.build_args }}

  deploy:
    name: Deploy hub VPS
    needs: [build-and-push]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.build-and-push.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_build))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VERSION
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="sha-${GITHUB_SHA:0:7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Deploy VERSION=$V"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          IP=$(dig +short "$SSH_HOST" A | head -1 || true)
          [ -n "$IP" ] && ssh-keyscan -T 15 -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync deploy/prod
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          DEST="${SSH_USER}@${SSH_HOST}"
          RSYNC="ssh -o StrictHostKeyChecking=yes"
          rsync -az --exclude '.env' -e "$RSYNC" deploy/prod/ "${DEST}:/root/lazuar-hub-prod/"
          rsync -az -e "$RSYNC" scripts/remote-deploy.sh "${DEST}:/root/lazuar-hub-remote-deploy.sh"
          ssh "$DEST" "chmod +x /root/lazuar-hub-remote-deploy.sh"

      - name: Inject HUB_ENV_FILE (optional)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          HUB_ENV_FILE: ${{ secrets.HUB_ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${HUB_ENV_FILE:-}" ]; then
            echo "HUB_ENV_FILE empty — keep server .env"
            exit 0
          fi
          printf '%s\n' "$HUB_ENV_FILE" | ssh "${SSH_USER}@${SSH_HOST}" \
            "cat > /root/lazuar-hub-prod/.env && chmod 600 /root/lazuar-hub-prod/.env"
          echo "Wrote /root/lazuar-hub-prod/.env from secret"

      - name: GHCR login on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GHCR_TOKEN || secrets.CR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "No pull token — relying on existing server docker login"
            exit 0
          fi
          USER="${GHCR_USERNAME:-allaboutevemirolive}"
          printf '%s\n' "$GHCR_TOKEN" | ssh "${SSH_USER}@${SSH_HOST}" \
            "docker login ghcr.io -u ${USER} --password-stdin"

      - name: Pull, up, health-gate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ssh "${SSH_USER}@${SSH_HOST}" \
            "export VERSION='${VERSION}' HEALTH_TIMEOUT=180; /root/lazuar-hub-remote-deploy.sh"
