# Build + push the pay-rs production image to GHCR (no secrets needed —
# auth is the automatic GITHUB_TOKEN). The VPS pulls it in deploy-pay-rs.
#
# Triggers: manual dispatch (optional tag input) or a pushed pay-rs-v* tag.
# The Dockerfile defaults ASPNETCORE_ENVIRONMENT=Production (ThrowIf on).

name: publish pay-rs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to git SHA)"
        required: false
        default: ""
  push:
    tags:
      - "pay-rs-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          t="${{ github.event.inputs.tag }}"
          if [ -z "$t" ] && [[ "${GITHUB_REF}" == refs/tags/pay-rs-v* ]]; then
            t="${GITHUB_REF#refs/tags/}"
          fi
          [ -n "$t" ] || t="sha-${GITHUB_SHA::12}"
          echo "tag=$t" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/lazuar-pay-rs
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/lazuar-pay-rs:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}/lazuar-pay-rs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
