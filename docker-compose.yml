services:
  db:
    image: postgres:16-alpine
    container_name: lazuar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lazuar_mvp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lazuar_mvp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lazuar-network

  api:
    build:
      context: .
      dockerfile: apps/lazuar-api/Dockerfile
    container_name: lazuar-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=db;Port=5432;Database=lazuar_mvp;Username=postgres;Password=postgres;Maximum Pool Size=50;
      - ConnectionStrings__TenantConnection=Host=db;Port=5432;Database=lazuar_mvp;Username=postgres;Password=postgres;Maximum Pool Size=50;
      - ConnectionStrings__MessagingConnection=Host=db;Port=5432;Database=lazuar_mvp;Username=postgres;Password=postgres;Maximum Pool Size=20;
      - R2__AccountId=${R2_ACCOUNT_ID}
      - R2__AccessKey=${R2_ACCESS_KEY}
      - R2__SecretKey=${R2_SECRET_KEY}
      - R2__BucketName=${R2_BUCKET_NAME:-lazuar-media-sandbox}
      - R2__ServiceUrl=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      - R2__PublicUrl=${R2_PUBLIC_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lazuar-network

volumes:
  pgdata:

networks:
  lazuar-network:
    name: lazuar-network
