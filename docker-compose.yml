# Local runtime stack. Host Caddy (on the server later) reverse_proxies these ports.
#   docker compose up -d --build                 # db + api
#   docker compose --profile full up -d --build  # + all frontends
#   docker compose -f docker-compose.ghcr.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: lazuar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lazuar_mvp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lazuar_mvp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lazuar-network

  api:
    build:
      context: .
      dockerfile: apps/lazuar-api/Dockerfile
    image: ghcr.io/proxeon/lazuar-hub-api:local
    container_name: lazuar-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=db;Port=5432;Database=lazuar_mvp;Username=postgres;Password=postgres;Maximum Pool Size=50;
      - ConnectionStrings__TenantConnection=Host=db;Port=5432;Database=lazuar_mvp;Username=postgres;Password=postgres;Maximum Pool Size=50;
      - ConnectionStrings__MessagingConnection=Host=db;Port=5432;Database=lazuar_mvp;Username=postgres;Password=postgres;Maximum Pool Size=20;
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_PUBLIC_DEV_URL=${R2_PUBLIC_DEV_URL}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lazuar-network

  lazuar-ops:
    build:
      context: .
      dockerfile: apps/lazuar-ops/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_PORTAL_URL: ${VITE_PORTAL_URL:-http://localhost:3004}
    image: ghcr.io/proxeon/lazuar-hub-ops:local
    container_name: lazuar-ops
    ports:
      - "3003:3000"
    depends_on:
      - api
    networks:
      - lazuar-network
    profiles: ["full"]

  lazuar-portal:
    build:
      context: .
      dockerfile: apps/lazuar-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_OPS_URL: ${NEXT_PUBLIC_OPS_URL:-http://localhost:3003}
    image: ghcr.io/proxeon/lazuar-hub-portal:local
    container_name: lazuar-portal
    ports:
      - "3004:3000"
    environment:
      API_URL: http://api:8080/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      - api
    networks:
      - lazuar-network
    profiles: ["full"]

  lazuar-admin:
    build:
      context: .
      dockerfile: apps/lazuar-admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    image: ghcr.io/proxeon/lazuar-hub-superadmin:local
    container_name: lazuar-superadmin
    ports:
      - "3005:3000"
    depends_on:
      - api
    networks:
      - lazuar-network
    profiles: ["full"]

  lazuar-developers:
    build:
      context: .
      dockerfile: apps/lazuar-developers/Dockerfile
      args:
        NEXT_BASE_PATH: /docs
    image: ghcr.io/proxeon/lazuar-hub-developers:local
    container_name: lazuar-developers
    ports:
      - "3002:3000"
    environment:
      OPENAPI_SPEC_ROOT: /app/openapi-specs
    depends_on:
      - api
    networks:
      - lazuar-network
    profiles: ["full"]

volumes:
  pgdata:

networks:
  lazuar-network:
    name: lazuar-network
