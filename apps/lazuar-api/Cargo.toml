[package]
name = "lazuar-api"
version = "0.1.0"
edition = "2021"
description = "lazuar-pay money host — Rust port of apps/lazuar-pay (sync, branch rust-port)"
publish = false

[dependencies]
rouille = "3.6"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-arbitrary-precision", "db-postgres"] }
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
subtle = "2"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
urlencoding = "2"
url = "2"
log = "0.4"
env_logger = "0.11"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
