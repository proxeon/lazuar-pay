# Overlay on apps/lazuar-pay/docker-compose.pay.yml. Does not replace .NET `pay`.
# Mutually exclusive with `pay` / `cargo run` / `task pay:dev` on :8081.
#
#   docker compose \
#     -f apps/lazuar-pay/docker-compose.pay.yml \
#     -f apps/lazuar-pay-rs/docker-compose.overlay.yml \
#     --profile pay-rs up -d --build
#
# Laptop default is Testing (Fake PSP mint). Set One__BaseUrl to hit live One.
# Staging/Production ThrowIf still forbids localhost One and http checkout.
services:
  pay-rs:
    profiles: ["pay-rs"]
    build:
      # Relative to this file and to apps/lazuar-pay/ (first compose file / project dir).
      context: ../lazuar-pay-rs
      dockerfile: Dockerfile
    image: ghcr.io/proxeon/lazuar-pay-rs:local
    ports:
      - "127.0.0.1:8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Testing}
      ConnectionStrings__Pay: postgres://postgres:postgres@pay-db:5432/lazuar_pay?sslmode=disable
      # Do not inherit apps/lazuar-pay/.env One__BaseUrl=localhost — that is the container loopback.
      One__BaseUrl: ${PAY_RS_ONE_BASE_URL:-http://host.docker.internal:8080/api/v1}
      Pay__CorsOrigins: ${Pay__CorsOrigins:-http://localhost:5178,http://127.0.0.1:5178,http://localhost:5179,http://127.0.0.1:5179}
      Pay__CheckoutBaseUrl: ${Pay__CheckoutBaseUrl:-http://localhost:5179}
      Pay__PublicBaseUrl: ${Pay__PublicBaseUrl:-http://localhost:8081}
      # Do not inherit apps/lazuar-pay/.env Pay__WrapKey (may not be 32-byte STANDARD base64).
      Pay__WrapKey: ${PAY_RS_WRAP_KEY:-}
      Pay__OneWebhookSecret: ${PAY_RS_ONE_WEBHOOK_SECRET:-}
      Pay__MetricsToken: ${PAY_RS_METRICS_TOKEN:-}
    depends_on:
      pay-db:
        condition: service_healthy
